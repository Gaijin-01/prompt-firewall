name: prompt-firewall
version: "1.1.3"
requires_hermes: ">=0.22.7"
description: "Deterministic prompt-injection firewall. Quarantines instruction-override, role-spoof, persistent-prompt, gateway-redirect, encoded-payload and security-disable patterns in untrusted tool output (web pages, repo files, README/AGENTS.md, SKILL.md, downloaded documents, tool results) and blocks at the tool/action boundary any attempt to write those patterns into persistent instructions, install a poisoned Skill, redirect the model endpoint, or disable the firewall. No LLM calls, no network, no external dependencies."
author: "Sefirot"
license: "MIT"
provides_hooks:
  - transform_tool_result
  - pre_tool_call
  - pre_llm_call
